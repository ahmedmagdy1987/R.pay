<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#040F1E"/>
  <!-- the spine, broken between branches — never through a peg, because every
       peg must be pegged to something -->
  <rect x="4"  y="6" width="7.5"  height="3" fill="#C8A96B"/>
  <rect x="14" y="6" width="14"   height="3" fill="#C8A96B"/>
  <!-- three pegs: socket, stem, JOINT, head -->
  
  <rect x="7" y="9" width="1" height="4.5" fill="#7A6742"/>
  <rect x="6" y="17" width="3" height="10" fill="#00AEEF"/>
  
  <rect x="17" y="9" width="1" height="4.5" fill="#7A6742"/>
  <rect x="16" y="17" width="3" height="10" fill="#6B7785"/>
  
  <rect x="24" y="9" width="1" height="4.5" fill="#7A6742"/>
  <rect x="23" y="17" width="3" height="10" fill="#00AEEF"/>
</svg>